[style]
shared = "Use case: game-texture. Restyle the supplied scaffold while preserving its exact framing and its flat straight-down view: the camera looks straight down, orthographic, exactly as the scaffold is drawn, so the picture is the plan of the machine, never an oblique or three-quarter view, with no perspective, no vanishing point, no foreshortening and no visible side face; every seat, cup and well is a concentric circle seen from directly above, its inner wall hidden all the way round and its far side no more visible than its near side. The scaffold is a flat pure green chroma-key background carrying the seat marks of one machine at true scale, each marked by role: a blue-green ring is an empty atom seat, a terracotta ring is a sacrificial feed that swallows its atom, a brass disc is a pivot, an open terracotta horseshoe is a hand, and the small dot at the heart of every ring and horseshoe is the exact centre of that seat, the point the atom will occupy. The machine stays within the tiles it stands on: every part, port, pipe, hinge, valve and chute included, lies within twice the ring's radius of some mark's centre, and nothing rises above or hangs below the seats or bulges out between two seats. Turn those marks into the machine described next as one freestanding object, compact and built tight around the marks, its body reaching and joining every mark, every seat, cup, well, funnel and hand built concentric on its dot, empty and unobstructed. The machine is compact and small against the green, but the marks are never pulled closer together: every seat stays exactly on its dot at the mark's own size, as far apart as the dots are, and the body between seats is slender rather than the seats moving inward; each seat housing hugs its ring closely, no part lies further from the nearest mark's centre than twice that ring's radius, and the machine stands directly on the green with no base, plate or floor under it. Every pixel the machine does not cover stays the untouched flat pure green key: no board, no tile, no plate, no well, no base, no table, no room, no beads, no atoms, no fist, no fingers, no text, numerals, logos or exposed clockwork. Flat base-colour capture with baked ambient occlusion only: photoreal glazed ceramic, darkened brass and worn rubber, no directional light, highlight, specular or cast shadow, so the one sprite is correct turned to any facing."
recipe = "The image of beads joined by bars is the compound that makes this machine, drawn at the scaffold's scale: take the shape of that structure, its count of beads and the way its bars join them, as the inspiration for the form of the machine, its body echoing the structure in its layout and its joins, and paint no bead and no bar."
edges = [
    "right",
    "top",
    "left",
    "bottom",
]
relight = "Use case: precise-object-edit. Edit target: the attached image. Keep the same image with identical geometry, materials, colours, texture detail and framing, and the matte grey sphere on its grey pad in the lower-right corner kept exactly where they are; only the lighting changes: it is now lit by one warm raking light coming from the {edge}, the light source sitting low at the {edge} edge of the picture and shining across the surface, so the {edge} half of the sphere is bright and its opposite half dark, and every ridge, seam and rim is lit on its {edge} side."

