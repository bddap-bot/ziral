[style]
shared = "The picture is a photoreal game sprite albedo of ONE substantial manufactured machine housing, seen straight down in orthographic plan. The scaffold supplies the exact framing: grey fills the union of footprint hexes, green is outside, coloured rings and dots mark functional openings. Grey and orange footprint fills are spatial guides, not a floor or painted slabs. Replace that entire connected envelope with one continuous sculpted cast housing, with generous material surrounding every opening, broad shoulders and a coherent perimeter. Its machine body itself occupies almost all the footprint, slightly inset from every outer edge; it is not a background, backing plate or tile layer. Seats are circular apertures cut into that mass, never round pods connected by narrow bridges, spokes, rails, bonds or thin necks. Each aperture is centred exactly on its dot and has the scaffold ring diameter, with an open pure-green centre and no obstruction. No extra apertures. Retained seats have blue-green rims, consumed feeds terracotta rims. Photoreal glazed ceramic, darkened brass and matte rubber, broad material areas and subtle contact-edge wear. Palette clay #D8C3A5, brass #6B4F3A, terracotta #C8553D, blue-green #4F8A8B, amber #E0A458, plum #7D5BA6 and ivory #F4EDE4. Flat non-directional base colour with mild symmetric ambient occlusion; no directional highlight, specular or cast shadow. The camera has no perspective and shows no side face or far inner wall. No atoms, beads, compound, connected balls, text, numerals, logo, exposed clockwork, separate plates, table or background beyond untouched pure green. The silhouette must remain inside the guide; do not enlarge, rotate or reframe it."
arm = "The picture is a game sprite: one compact kiln-floor machine seen in a flat plan from directly above, orthographic, no perspective, no vanishing point, no foreshortening, no side face, every seat, cup and well a concentric circle with its inner wall hidden all the way round, painted over the attached scaffold at the scaffold's exact framing. The scaffold is a flat pure green chroma-key background carrying the seat marks of the machine at true scale, each marked by role: a blue-green ring is an empty atom seat, a terracotta ring is a sacrificial feed that swallows its atom, a brass disc is a pivot, an open terracotta horseshoe is a hand, and the dot at the heart of every ring and horseshoe is the exact centre of that seat, where the atom sits. In the finished picture every seat, cup, well, funnel and hand is built concentric on its dot at the mark's own size, empty and unobstructed, as far apart as the dots are; the body between seats is slender and hugs the marks; no part lies further from the nearest mark's centre than twice that ring's radius, nothing rises above or hangs below the seats or bulges out between two seats, and the machine stands directly on the green with no base, plate or floor under it. Every pixel the machine does not cover is the untouched flat pure green key: no board, tile, plate, well, base, table, room, bead, atom, fist, finger, text, numeral, logo or exposed clockwork. The materials are photoreal glazed ceramic, darkened brass and worn rubber in the workshop palette: clay #D8C3A5, dark brass #6B4F3A, terracotta #C8553D, blue-green #4F8A8B, amber #E0A458, plum #7D5BA6, ivory #F4EDE4; the capture is flat base colour with baked ambient occlusion only, no directional light, highlight, specular or cast shadow, so the one sprite is correct turned to any facing; no labels, watermark, menus, clutter or named-game resemblance."
critic = """Judge one machine sprite for a game against its art bible. The first image is the machine as the game shows it: the cut sprite over the board's clay tiles at gameplay scale, magnified without smoothing, so the pixel steps are the magnification and not the art. The second image is the scaffold it was painted over: a flat green key carrying one mark per seat, a ring or an open horseshoe with a dot at its exact centre, and a brass disc for a pivot; it is there for reference only, not a checklist, and no difference between the picture and the marks is a fault. The code has already measured that every seat sits on its mark and that the sprite stays within its tiles, so neither is yours to judge; and how the body joins its seats, which seat connects to which and by what, is the painter's call and never counts against the picture. Judge, in this order. Presence: the sprite reads at a glance at this scale as one solid, weighty kiln-floor object. Material richness: glazed ceramic, darkened brass and worn rubber read as those materials, wear gathered at contact edges, detail that rewards a close look. Artist moxie: the painting is confident and characterful, a machine somebody made, not a timid diagram of the marks. Then these rules quoted from the bible, as blemishes a strong picture carries lightly. View: "Every machine is drawn from directly above, the camera straight down and orthographic, so one sprite turns to any facing by rotating about its cell. A visible side face, a cup's far inner wall, a vanishing point are the tells." Language: "Glazed clay for the board and atoms, rubbed brass for arms and bonds, matte rubber for hands. Rotatable art is captured as albedo under even, diffuse, non-directional light: curvature comes from symmetric tonal structure, wear gathers at contact edges only, and there is no cast shadow or directional highlight to swing with a turn." Silhouette: "Stout circular pivots, an open horseshoe for the hand. Every state is readable from the outline alone." Glyphs: "Its circular seats remain broad and unobstructed beneath atoms, so the machine story never obscures how it is used." Forbidden: "Exposed clockwork; grime or wear over a state glaze; tiny ornamental hardware; text or numerals on the board; pure black or white (dark brass and ivory instead)." And the sprite is one complete object with every seat empty and nothing under it: no plate, no tile, no base, no trace of the green key. The score: 10 has presence, rich material and moxie and breaks no rule; 8 is the bar, presence, rich material and moxie with at most a blemish a player would not notice; below 8 the picture is dull, thin in material or timid, or breaks a rule plainly, and the more it lacks or the more plainly, the lower; a picture with moxie that carries a light blemish scores above a dull picture that breaks no rule. The issues: what is wrong and where, in the painter's terms, so the next paint can fix it; name only what you judged, never seat position, footprint, or how the parts connect."""
