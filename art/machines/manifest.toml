candidates = 4

[style]
shared = "The picture is a photoreal game sprite albedo of ONE substantial manufactured machine housing, seen straight down in orthographic plan. The scaffold supplies the exact framing: grey fills the union of footprint hexes, green is outside, coloured rings and dots mark functional openings. Grey and orange footprint fills are spatial guides, not a floor or painted slabs. Directive (verbatim): «bodies are NOT all slender; the written spec (manifest envelope ≈ twice the seat radius) is misaligned with the intended direction and gets revised, not the art. Machines may fill their hex — the current source housing (full, broad) is the reference. On the source specifically, the non-centre hexes pointing toward the middle is the intended design language; keep it.» The envelope rule is a filled, full-bodied solid occupying almost all its footprint, slightly inset from the outer edges, with generous material around functional openings; sparse or thin housings are not the norm. Keep the cobalt converter's styling, but do not use its open, cut-out silhouette as the general body model. For radial housings where applicable, outer hexagonal forms point toward the centre as on the source; these are features of one continuous housing, not separate tile panels. A machine whose function is a moving part rather than a housing may stay slender and need not fill its tile; the arm is one example, and similar functional exceptions are at artistic discretion. The body is the machine itself, not a background, backing plate or tile layer. Seats are circular apertures cut into that mass, never round pods connected by narrow bridges, spokes, rails, bonds or thin necks. Each aperture is centred exactly on its dot and has the scaffold ring diameter, with an open pure-green centre and no obstruction. No extra apertures. Retained seats have blue-green rims, consumed feeds terracotta rims. Use the palette table in art/BIBLE.md, including its material colour. The camera has no perspective and shows no side face or far inner wall. No atoms, beads, compound, connected balls, text, numerals, logo, exposed clockwork, separate plates, table or background beyond untouched pure green. The silhouette must remain inside the guide; do not enlarge, rotate or reframe it."
arm = "The picture is a game sprite: one compact kiln-floor machine seen in a flat plan from directly above, orthographic, no perspective, no vanishing point, no foreshortening, no side face, every seat, cup and well a concentric circle with its inner wall hidden all the way round, painted over the attached scaffold at the scaffold's exact framing. The scaffold is a flat pure green chroma-key background carrying the seat marks of the machine at true scale, each marked by role: a blue-green ring is an empty atom seat, a terracotta ring is a sacrificial feed that swallows its atom, a brass disc is a pivot, an open terracotta horseshoe is a hand, and the dot at the heart of every ring and horseshoe is the exact centre of that seat, where the atom sits. In the finished picture every seat, cup, well, funnel and hand is built concentric on its dot at the mark's own size, empty and unobstructed, as far apart as the dots are; the body between seats is slender and hugs the marks; nothing rises above or hangs below the seats or bulges out between two seats, and the machine stands directly on the green with no base, plate or floor under it. Every pixel the machine does not cover is the untouched flat pure green key: no board, tile, well, base, table, room, bead, atom, fist, finger, text, numeral, logo or exposed clockwork. Use the palette table in art/BIBLE.md, including its material colour. No labels, watermark, menus or named-game resemblance."
critic = "Judge one machine sprite holistically for overall visual strength and detail. The first image is the cut sprite over the board's clay tiles at gameplay scale, magnified without smoothing; the pixel steps are the magnification, not the art. The second image is its scaffold, a spatial reference rather than a visual checklist. The code has already checked footprint, seat placement and centring; do not score those measurements again. Presence: one solid, weighty kiln-floor object reads at a glance. Material richness: glazed ceramic, darkened brass and worn rubber feel tangible, with detail that rewards a close look. Artist moxie: confident, characterful painting, a machine somebody made. Detail and material richness count for the picture, never against it; prefer more detailed candidates. Artistic constraints are matters of judgment, not hard failures, automatic deductions or score caps. Score 0 through 10 for the overall picture: the strongest combines presence, rich material, detail and confidence; a weaker picture lacks those qualities. The issues name concrete visible opportunities to strengthen the next painting, in the painter's terms. Do not penalize exposed clockwork, ornamental fittings, wear over glaze, or departures from idealized view, lighting or silhouette merely for breaking a rule. Text or numerals on the board remain unwanted; judge their visual effect without a hard fail or score cap."
facings = [
    "upper-left",
    "upper-right",
    "right",
    "lower-right",
    "lower-left",
    "left",
]
elevation = 45.0

[thresholds]
outside = 0.05
seat = 0.1
off_centre = 0.1
critic = 8
sphere = 25.0

