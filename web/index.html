<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>ziral</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141414; }
      #ziral { display: block; width: 100%; height: 100%; }
      #why { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem;
             color: #f66; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="ziral"></canvas>
    <div id="why"></div>
    <script type="module">
      import init from "./ziral.js";
      init().catch((e) => {
        if (!String(e).includes("Using exceptions for control flow"))
          document.getElementById("why").textContent = String(e);
      });
    </script>
  </body>
</html>
