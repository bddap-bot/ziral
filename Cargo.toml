[package]
name = "ziral"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_log",
    "bevy_asset",
    "bevy_winit",
    "x11",
    "wayland",
    "webgl2",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_window",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_ui",
    "bevy_ui_render",
    "png",
    "serialize",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["Clipboard", "Navigator", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["audio", "wav"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
libc = "0.2"
quick-xml = "0.41"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
debug = 1
opt-level = 3
debug-assertions = true
overflow-checks = true

[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
bevy_gizmos_render = { path = "vendor/bevy_gizmos_render" }
wgpu-hal = { path = "vendor/wgpu-hal" }
glow = { path = "vendor/glow" }
